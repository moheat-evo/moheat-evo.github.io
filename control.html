<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090708" />
  <meta name="robots" content="noindex" />
  <title>MoHeat Evo — Device Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="control.css?v=4" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="./">MoHeat <span>Evo</span></a>
    <div class="device">
      <select id="portSelect" aria-label="Serial port"></select>
      <button class="btn sm" id="addPort" type="button" title="Authorize a new USB or Bluetooth serial port">+ Add</button>
      <button class="btn sm primary" id="connectBtn" type="button" disabled>Connect</button>
      <p class="status" id="deviceStatus"><i></i><span>Not connected</span></p>
    </div>
    <button class="estop" id="estop" type="button">■ STOP</button>
  </header>

  <p class="unsupported" id="unsupported" hidden>Needs <b>Web Serial</b> and <b>tab audio capture</b> — open this page in desktop <b>Chrome</b> or <b>Edge</b>.</p>

  <main class="layout">
    <!-- Video -->
    <section class="stage">
      <form class="source" id="ytForm">
        <input id="ytUrl" type="url" placeholder="Paste a YouTube link" autocomplete="off" />
        <button class="btn" type="submit">Load</button>
        <span class="or">or</span>
        <label class="btn" for="mediaFile">Upload video / audio</label>
        <input id="mediaFile" type="file" accept="video/*,audio/*" hidden />
      </form>
      <div class="player" id="playerWrap">
        <div id="ytPlayer"></div>
        <video id="mediaEl" controls playsinline hidden></video>
        <p class="player-empty">Paste a YouTube link or upload a video</p>
      </div>
      <div class="source-row">
        <button class="btn primary" id="syncBtn" type="button" hidden>Start thermal sync</button>
        <p class="status" id="sourceStatus"><i></i><span>No source</span></p>
      </div>
    </section>

    <!-- Controls -->
    <aside class="side">
      <div class="card">
        <div class="card-head"><span>Temperature</span><b id="tempValue">60% warmth</b></div>
        <input id="tempRange" type="range" min="-100" max="100" value="60" aria-label="Temperature feedback" />
        <div class="scale"><span>Cool</span><span>Off</span><span>Warm</span></div>
      </div>

      <div class="ears">
        <div class="ear" data-ch="0"><span class="ear-side">LEFT</span><b class="ear-val">Off</b><div class="meter"><i></i></div><span class="ear-pwm">off</span></div>
        <div class="ear" data-ch="1"><span class="ear-side">RIGHT</span><b class="ear-val">Off</b><div class="meter"><i></i></div><span class="ear-pwm">off</span></div>
      </div>

      <div class="card">
        <div class="card-head"><span>Level response</span></div>
        <label class="toggle"><input id="autoNorm" type="checkbox" checked /><span>Auto-normalize to the loudest part</span></label>
        <label class="field" id="gainField"><span>Sensitivity <b id="gainValue">×1.0</b></span><input id="gain" type="range" min="1" max="10" step=".1" value="1" /></label>
        <label class="field"><span>Noise gate <b id="gateValue">8%</b></span><input id="gate" type="range" min="0" max="30" step="1" value="8" /></label>
      </div>

      <div class="card">
        <div class="card-head"><span>Output range (PWM)</span><button class="link" id="resetRange" type="button">Reset</button></div>
        <div class="range-grid">
          <label>Heat min<input id="heatMin" type="number" min="0" max="255" value="0" /></label>
          <label>Heat max<input id="heatMax" type="number" min="0" max="255" value="200" /></label>
          <label>Cool min<input id="coolMin" type="number" min="0" max="255" value="35" /></label>
          <label>Cool max<input id="coolMax" type="number" min="0" max="255" value="80" /></label>
        </div>
      </div>

      <div class="card cmd-card">
        <div class="card-head"><span>Last command</span><code id="lastCmd">—</code></div>
        <details class="log"><summary>Serial log</summary><pre id="log"></pre></details>
      </div>
    </aside>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="control.js?v=4"></script>
</body>
</html>
